[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emoji-asr"
version = "0.1.0"
description = "Multimodal emoji insertion for affective ASR transcripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.48",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
asr = ["openai-whisper>=20231117", "soundfile>=0.12", "librosa>=0.10"]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
